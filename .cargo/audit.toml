# cargo-audit configuration, read by `cargo audit` locally and in CI
# (.github/workflows/quality-checks.yml).
#
# Every ignore below names one advisory and says why it is accepted. Remove an
# entry as soon as the dependency that triggers it is gone from Cargo.lock.

[advisories]
ignore = [
    # bincode 1.3.3 is unmaintained (informational, no vulnerability). It is
    # pulled in only by the TUI's markdown rendering: tui-markdown 0.3.13's
    # default `highlight-code` feature -> syntect 5.3.0 with `default-syntaxes`
    # and `default-themes`, which need syntect's `dump-load` (the bundled
    # syntaxes and themes are bincode dumps) and so `bincode`. Checked
    # 2026-11-20: tui-markdown 0.3.13 and syntect 5.3.0 are the latest
    # releases; tui-markdown has no feature that keeps highlighting without
    # syntect's bundled dumps, and turning `highlight-code` off would drop the
    # syntax colouring of fenced code blocks (```rust, ```bash, ...) in the
    # TUI's task body view, so it stays on. Remove this entry when syntect
    # moves `dump-load` off bincode 1.x (or tui-markdown stops needing it).
    "RUSTSEC-2025-0141",
    # chrono is unmaintained (informational, no vulnerability). bea-rs itself
    # no longer uses it (timestamps are jiff), but rmcp 3.11.0 depends on it
    # unconditionally and turns on schemars' `chrono04` feature, so it stays in
    # the lockfile of the `bea` binary; the library alone has none. Remove this
    # entry when an rmcp release drops chrono.
    "RUSTSEC-2026-0543",
]

[output]
# Fail on informational advisories too (unmaintained, unsound, yanked), not
# only on vulnerabilities.
deny = ["warnings"]
quiet = false
