# cargo-audit configuration, read by `cargo audit` locally and in CI
# (.github/workflows/quality-checks.yml).
#
# Every ignore below names one advisory and says why it is accepted. Remove an
# entry as soon as the dependency that triggers it is gone from Cargo.lock.

[advisories]
ignore = [
    # bincode 1.3.3 is unmaintained (informational, no vulnerability). It is
    # pulled in only by the TUI's markdown rendering: tui-markdown -> syntect.
    # Upstream calls 1.3.3 complete; there is no patched version, and dropping
    # it means changing how syntect is used by tui-markdown.
    "RUSTSEC-2025-0141",
    # chrono is unmaintained (informational, no vulnerability). bea-rs uses it
    # for task timestamps, and rmcp and schemars depend on it as well, so it
    # cannot leave the lockfile by changing this crate alone. Replacing it is
    # tracked as separate work.
    "RUSTSEC-2026-0543",
]

[output]
# Fail on informational advisories too (unmaintained, unsound, yanked), not
# only on vulnerabilities.
deny = ["warnings"]
quiet = false
