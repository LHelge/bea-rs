name: Reusable Quality Checks

on:
  workflow_call:

jobs:
  quality-checks:
    name: Format, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.23.0

      # Reads .cargo/audit.toml: fails on vulnerabilities and on unmaintained,
      # unsound or yanked crates, except for the advisories ignored there.
      - name: Check RustSec advisories
        run: cargo audit
